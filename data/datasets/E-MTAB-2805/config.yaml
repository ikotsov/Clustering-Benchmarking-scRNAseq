protocol: "SMARTer (Fluidigm C1)"
n_clusters: 3
species: "mouse"
preprocessing:
  # G1 cells have a median mito fraction of ~6%, so the 0.05 default would mostly remove G1 cells.
  mito_threshold: 0.2
  min_gene_max_count: 2
  # Drops the empty capture wells (< 2,000 counts; the other cells have > 100,000).
  count_threshold: 100000
