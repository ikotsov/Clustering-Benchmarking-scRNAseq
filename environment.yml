name: scrna-seq-clustering
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.14
  # Core scientific stack
  - numpy>=2.3
  - scipy>=1.16
  - pandas>=3.0
  - scikit-learn>=1.7
  # Single-cell analysis
  - scanpy>=1.12
  - anndata>=0.11
  - python-igraph>=1.0
  - leidenalg>=0.11
  # Hyperparameter tuning
  - optuna>=4.8
  # Workflow
  - snakemake-minimal>=9.0
  # Plotting
  - matplotlib>=3.10
  - seaborn>=0.13
  # Utilities
  - pyyaml>=6.0
  - typing_extensions
  # Notebooks
  - ipykernel
  # Testing
  - pytest>=9.0
  # Install this repo's `src` package in editable mode
  - pip
  - pip:
      - -e .
